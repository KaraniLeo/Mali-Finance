<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B8E23"/>
      <stop offset="100%" stop-color="#2D3911"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Inner Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F7F2"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>

  <!-- Subtle African Geometric Background Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#A3B18A" stroke-width="3" stroke-dasharray="16 12" opacity="0.35"/>

  <!-- African Shield Contour (Outer Gold Ring) -->
  <path d="M 256 70 C 350 70 410 130 410 250 C 410 360 330 425 256 450 C 182 425 102 360 102 250 C 102 130 162 70 256 70 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- African Shield Inner Fill -->
  <path d="M 256 86 C 338 86 392 140 392 250 C 392 348 322 408 256 430 C 190 408 120 348 120 250 C 120 140 174 86 256 86 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Iconic Stylized "M" & Cowrie Shell Wealth Motif -->
  <!-- Left Wing of M -->
  <path d="M 175 340 L 175 190 C 175 165 210 160 230 185 L 256 218 L 282 185 C 302 160 337 165 337 190 L 337 340" 
        fill="none" stroke="#2D3911" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden Central Cowrie Core / Wealth Gem -->
  <ellipse cx="256" cy="285" rx="36" ry="55" fill="url(#goldGrad)"/>
  
  <!-- Cowrie Inner Slit Lines (African Currency Symbol) -->
  <path d="M 256 242 L 256 328" stroke="#2D3911" stroke-width="6" stroke-linecap="round"/>
  <path d="M 244 260 L 268 260 M 240 285 L 272 285 M 244 310 L 268 310" stroke="#2D3911" stroke-width="4" stroke-linecap="round"/>

  <!-- Top Star Accent (Wisdom & Guidance) -->
  <polygon points="256,110 263,126 280,126 266,136 271,152 256,142 241,152 246,136 232,126 249,126" fill="url(#goldGrad)"/>
</svg>
