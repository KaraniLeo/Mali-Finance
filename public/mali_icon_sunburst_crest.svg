<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3911"/>
      <stop offset="100%" stop-color="#141E05"/>
    </linearGradient>

    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="brandAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#6B8E23"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad3)"/>

  <!-- African Sunburst Rays Background -->
  <g opacity="0.18" stroke="url(#goldGrad3)" stroke-width="4">
    <line x1="256" y1="50" x2="256" y2="462"/>
    <line x1="50" y1="256" x2="462" y2="256"/>
    <line x1="110" y1="110" x2="402" y2="402"/>
    <line x1="110" y1="402" x2="402" y2="110"/>
  </g>

  <!-- Giant Golden Shilling Coin Perimeter -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad3)" stroke-width="16"/>
  <circle cx="256" cy="256" r="162" fill="url(#brandAccentGrad)"/>

  <!-- African Tribal Diamond Geometry Frame -->
  <polygon points="256,110 390,256 256,402 122,256" fill="none" stroke="#FFF" stroke-width="6" opacity="0.6"/>

  <!-- Bold Modern 2D "M" Emblem with Inner Golden Coin Sparkle -->
  <path d="M 172 340 V 180 L 236 265 L 256 290 L 276 265 L 340 180 V 340" 
        fill="none" stroke="#FFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden African Cowrie / Sun Gem Core -->
  <circle cx="256" cy="220" r="28" fill="url(#goldGrad3)" stroke="#141E05" stroke-width="4"/>
</svg>
